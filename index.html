<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Rules & Acronyms</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        hr {
            border: none;
            border-top: 1px solid #333;
            margin: 20px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px 14px;
            text-align: center;
        }
        th {
            background-color: #1a1a1a;
        }
        .img-center {
            display: block;
            margin: 0 auto;
            width: 96px;
            height: 96px;
        }
    </style>
</head>
<body>

    <div id="content">Načítavam obsah...</div>

    <script>
        function renderMarkdown() {
            if (typeof marked === 'undefined') {
                document.getElementById('content').innerHTML = '<p style="color: red;">Chyba: Knižnicu Marked sa nepodarilo načítať.</p>';
                return;
            }

            fetch('content.md')
                .then(response => {
                    if (!response.ok) throw new Error('Nepodarilo sa načítať content.md (Status: ' + response.status + ')');
                    return response.text();
                })
                .then(markdownText => {
                    document.getElementById('content').innerHTML = marked.parse(markdownText);
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = '<p style="color: red;">Chyba: ' + error.message + '</p>';
                });
        }

        if (typeof marked === 'undefined') {
            const fallbackScript = document.createElement('script');
            fallbackScript.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
            fallbackScript.onload = renderMarkdown;
            fallbackScript.onerror = function() {
                document.getElementById('content').innerHTML = '<p style="color: red;">Chyba: Nepodarilo sa načítať Marked.js ani zo záložného zdroja.</p>';
            };
            document.head.appendChild(fallbackScript);
        } else {
            renderMarkdown();
        }
    </script>

</body>
</html>
