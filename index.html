<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Rules & Acronyms</title>
    <!-- Načítanie knižnice Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        hr {
            border: none;
            border-top: 1px solid #333;
            margin: 20px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px 14px;
            text-align: center;
        }
        th {
            background-color: #1a1a1a;
        }
        .img-center {
            display: block;
            margin: 0 auto;
            width: 96px;
            height: 96px;
        }
    </style>
</head>
<body>

    <!-- Miesto, kam sa vykreslí obsah -->
    <div id="content">Načítavam obsah...</div>

    <script>
        // Načítanie externého .md súboru cez fetch (funguje spoľahlivo aj na GitHub Pages)
        fetch('content.md')
            .then(response => {
                if (!response.ok) throw new Error('Nepodarilo sa načítať content.md');
                return response.text();
            })
            .then(markdownText => {
                document.getElementById('content').innerHTML = marked.parse(markdownText);
            })
            .catch(error => {
                document.getElementById('content').innerHTML = '<p style="color: red;">Chyba: ' + error.message + '</p>';
            });
    </script>

</body>
</html>
