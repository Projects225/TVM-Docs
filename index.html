<h2 align="center"><span style="color:red;">Rules</span></h2>

### <span style="color:#ffc000;">Name</span>
**<span style="color:#ffc000;">Name only in English(USA)<br>Exceptions:<br>If cannot find English title<br>If original languaue Tite is more recognazible than english one</span>**

### <span style="color:aqua;">Links</span>
**<span style="color:aqua;">Allowed content database sources:</span>**  
**<span style="color:red;">ČSFD - only "csfd.cz" (csfd.sk forbidden); link ends only with "/prehled" or nothing ".../"</span>**  
**<span style="color:yellow;">IMDB - only clean link not with referal part of link</span>**  
**<span style="color:fuchsia;">Network - link to official network of title (ex. ReelShort)</span>**

### <span style="color:red;">My Rating Position (MRP)</span>
**<span style="color:red;">MRP rating is allowed only on titles with 103% or more</span>** <span style="color:#00ff00;">Average Rating</span>

### <span style="color:#A546EC;">Seen</span>
**<span style="color:#A546EC;">Seen format:<br>[Full Times Seen OR Uncertain Watched Times] + [Watched with TVM] - [Watched episodes / minites]; [Watched episodes / minites]<br><br>Letter prefixes of titles with uncertain watched times:<br>Q = 3+ (count as 4 in SeenCalc)<br>X = 3<br>Y = 2<br>Z = 1<br><br>If title is going to be watched 3rd time with CZ dabing or more must be seen in original / English dabing.</span>**

### <span style="color:fuchsia;">Shorts AI Rating</span>
**<span style="color:fuchsia;">Shorts that are AI (with "AI" tag) is maximum</span>** <span style="color:#00ff00;">AR = 50%</span>

***

<h2 align="center"><span style="color:#11cf00;">Acronyms</span></h2>

**<span style="color:white;">Color / Emoji Prefixes:</span>**  
**<span style="color:aqua;">⚙️ System / App</span>**  
**<span style="color:red;">🎬 Movies</span>**  
**<span style="color:orange;">📺 TVShows</span>**  
**<span style="color:fuchsia;">📱 Shorts</span>**  
**<span style="color:#00ff00;">♻️ Universal</span>**

| Prefix | <span style="color:#11cf00;">Acronym</span> | <span style="color:aqua;">Description</span> |
| :-: | :-: | :-: |
| ⚙️ | **<span style="color:#00CC99;">FDC</span>** | **<span style="color:#00B0F0;">Filming</span> / <span style="color:#92D050;">Done</span> / <span style="color:red;">Cancelled</span>** |
| ⚙️ | **<span style="color:#CC3300;">Dab / ST / O</span>** | **<span style="color:red;">Dabing</span> / <span style="color:aqua;">Subtitles</span> / <span style="color:yellow;">Original dabing</span>** |
| 🎬 | **<span style="color:red;">KR</span>** | **<span style="color:red;">KinoRip</span>** |
| 🎬📱 | **<span style="color:#A3FF00;">MS</span>** | **<span style="color:#A3FF00;">Movie / Short Series</span>** |
| 🎬📱 | **<span style="color:#A3FF00;">MSaiP</span>** | **<span style="color:#A3FF00;">Movie Series add in Progress</span>** |
| 📺 | **<span style="color:orange;">NSR:</span>** | **<span style="color:orange;">New Season Release</span>** |
| 📺 | **<span style="color:orange;">LE:</span>** | **<span style="color:orange;">Last Episode</span>** |
| 📺 | **<span style="color:orange;">TL</span>** | **<span style="color:orange;">Too Long (TVShow with 5 season or longer)</span>** |
| 📺 | **<span style="color:orange;">CW</span>** | **<span style="color:orange;">Currently Watching</span>** |
| ♻️ | **<span style="color:#00ff00;">TN</span>** | **<span style="color:#00ff00;">Too New</span>** |
| ♻️ | **<span style="color:#00ff00;">WP:</span>** | **<span style="color:#00ff00;">Watch Priority</span> <span style="color:#FF0000;">(Highest - 1 -</span> <span style="color:#FFA700;">2 -</span> <span style="color:#FFF400;">3 -</span> <span style="color:#A3FF00;">4 -</span> <span style="color:#2CBA00;">5 - Lowest)</span>** |
